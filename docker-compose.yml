version: '3.8'

services:
  precedent-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: precedent_api
    ports:
      - "8000:8000"
    environment:
      - HINDSIGHT_BASE_URL=${HINDSIGHT_BASE_URL:-https://api.hindsight.vectorize.io}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_PRIMARY=${LLM_PRIMARY:-llama-3.3-70b-versatile}
      - LLM_FALLBACK=${LLM_FALLBACK:-llama-3.1-8b-instant}
      - DATABASE_URL=postgresql://precedent:precedent@postgres:5432/precedent_db
      - REDIS_URL=redis://redis:6379/0
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-precedent_webhook_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  precedent-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_USE_MOCK: "false"
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    container_name: precedent_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_USE_MOCK=false
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - precedent-api
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: precedent_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=precedent
      - POSTGRES_PASSWORD=precedent
      - POSTGRES_DB=precedent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precedent -d precedent_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: precedent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
