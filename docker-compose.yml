version: '3.8'

services:
  precedent-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_USE_MOCK: "true"
        NEXT_PUBLIC_API_URL: ""
    container_name: precedent_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_USE_MOCK=true
      - NEXT_PUBLIC_API_URL=
    restart: unless-stopped
